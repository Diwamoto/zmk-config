# This file generates the GitHub Actions matrix
# For simple board + shield combinations, add them
# to the top level board and shield arrays, for more
# control, add individual board + shield combinations to
# the `include` property, e.g:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#
---
include:
  ## ae_nrf52840 mx
  - board: ae_nrf52840
    shield: sage60_left
    snippet: studio-rpc-usb-uart
  - board: ae_nrf52840
    shield: sage60_right
  ## ae_nrf52840 ec
  - board: ae_nrf52840
    shield: sage60_ec_left
    cmake-args: -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/config/sage60_drivers/"
  - board: ae_nrf52840
    shield: sage60_ec_right
    cmake-args: -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/config/sage60_drivers/"
  ## ae_nrf52840 setting reset
  - board: ae_nrf52840
    shield: settings_reset


  ## xiao mx
  - board: seeeduino_xiao_ble
    shield: sage60_xiao_left
  - board: seeeduino_xiao_ble
    shield: sage60_xiao_right
  ## xiao ec
  - board: seeeduino_xiao_ble
    shield: sage60_xiao_ec_left
    snippet: zmk-usb-logging
    cmake-args: -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/config/sage60_drivers/"
  - board: seeeduino_xiao_ble
    shield: sage60_xiao_ec_right
    snippet: zmk-usb-logging
    cmake-args: -DZMK_EXTRA_MODULES="${GITHUB_WORKSPACE}/config/sage60_drivers/"
  ## xiao setting reset
  - board: seeeduino_xiao_ble
    shield: settings_reset